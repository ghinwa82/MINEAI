<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="gold" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="18%" stop-color="#FFF1C1"/>
      <stop offset="44%" stop-color="#E2C275"/>
      <stop offset="72%" stop-color="#B68D3A"/>
      <stop offset="100%" stop-color="#8A6A22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFF1C1"/>
      <stop offset="42%" stop-color="#E2C275"/>
      <stop offset="100%" stop-color="#B68D3A"/>
    </linearGradient>
    <radialGradient id="plate" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#191519"/>
      <stop offset="58%" stop-color="#0E0C10"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="finial" cx="42%" cy="34%" r="64%">
      <stop offset="0%" stop-color="#FFFDF4"/>
      <stop offset="48%" stop-color="#FFF1C1"/>
      <stop offset="100%" stop-color="#B68D3A"/>
    </radialGradient>
  </defs>

  <!-- Chamfered diamond shield -->
  <path d="M48 3 L85 24.5 V63.5 L48 93 L11 63.5 V24.5 Z" fill="url(#plate)" stroke="url(#edge)" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M48 7.6 L81.2 26.6 V61.4 L48 88.4 L14.8 61.4 V26.6 Z" fill="none" stroke="#FFF1C1" stroke-opacity="0.16" stroke-width="0.8"/>

  <!-- Sculptural M: two gold spines meeting the valley -->
  <path d="M29 71 V41.5 L48 58.5 L67 41.5 V71" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="8.4" transform="translate(0.9,1.4)"/>
  <path d="M29 71 V41.5 L48 58.5 L67 41.5 V71" fill="none" stroke="url(#gold)" stroke-width="7.2" stroke-linecap="square"/>
  <path d="M29 71 V41.5 L48 58.5 L67 41.5 V71" fill="none" stroke="#FFFDF0" stroke-opacity="0.6" stroke-width="0.9" transform="translate(-0.7,-0.8)"/>

  <!-- Crown spire out of the valley, diamond finial at the apex -->
  <path d="M48 58.5 V13.5" fill="none" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M48 7.4 51.4 12.4 48 17.4 44.6 12.4Z" fill="url(#finial)" stroke="#3A2A08" stroke-opacity="0.7" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Ticker plinth -->
  <rect x="33" y="76.4" width="30" height="5.4" rx="1.6" fill="#E2C275" fill-opacity="0.16" stroke="#FFF1C1" stroke-opacity="0.34" stroke-width="0.5"/>
  <path d="M36.4 79.1h23.2" stroke="#FFF1C1" stroke-opacity="0.55" stroke-width="0.55" stroke-linecap="round"/>
</svg>
